name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-verification:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Install the Playwright-pinned browser
        working-directory: app
        run: npx playwright install chromium

      - name: Run the canonical verification
        shell: powershell
        run: .\tools\verify.ps1 -TaskId "CI-${{ github.run_id }}-${{ github.run_attempt }}"

      # Raw browser traces may contain future user content, so CI only retains the minimal receipt.
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-receipt-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: output/run-receipt.json
